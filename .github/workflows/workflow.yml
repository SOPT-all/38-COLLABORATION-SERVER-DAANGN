name: 38th collaboration ios3 deploy

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate application.yml
        run: |
          mkdir -p src/main/resources
          echo "${{ secrets.APPLICATION }}" > src/main/resources/application.yml

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Upload JAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "build/libs/*SNAPSHOT.jar"
          target: /home/ubuntu
          strip_components: 2

      - name: Restart Spring Boot on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ubuntu
            
            CURRENT_PIDS=$(ps -ef | grep "\.jar" | grep -v grep | awk '{print $2}')
            if [ -z "$CURRENT_PIDS" ]; then
              echo "No running application found."
            else
              echo "Killing running application(s): $CURRENT_PIDS"
              for pid in $CURRENT_PIDS; do
                kill -15 $pid
              done
              sleep 5
            fi
            
            JAR=$(ls *.jar 2>/dev/null | head -n 1)
            if [ -z "$JAR" ]; then
              echo "No jar file found."
              exit 1
            fi
            
            nohup java -jar -Duser.timezone=Asia/Seoul "$JAR" > nohup.out 2>&1 &